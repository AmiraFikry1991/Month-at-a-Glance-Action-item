<title>Month at a Glance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky switcher bar, pastel hero band per agent, two-column work area that stacks on phones; admin has payroll, review rules and a month-by-month cost ledger */
:root{
  color-scheme:light;
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F3F6FA; --ink:#1F2A3A; --muted:#5A6778; --line:#E4E8EE;
  --band:#EAF2FB; --band-2:#FFFFFF; --band-ink:#1F2A3A; --band-muted:#5A6778;
  --accent:#257E8B; --accent-ink:#FFFFFF; --accent-soft:#E1F1F4;
  --brass:#8A5A12; --brass-soft:#FBEFD9; --band-brass:#FDE6D2;
  --good:#1D6B45; --good-bg:#E2F4EA; --warn:#8F4A10; --warn-bg:#FCEBDD; --bad:#A12A20; --bad-bg:#FCE6E3;
  --c-salary:#C7DBF3; --c-com:#BDE5E1; --c-bonus:#F8D7BF;
  --display:'DM Serif Display', Georgia, 'Times New Roman', serif;
  --body:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--ink)}
h3{font-size:15px;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-right:auto}
.logo{height:36px;width:auto;display:block}
.appname{display:flex;flex-direction:column;line-height:1.2}
.appname small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.brand .divider{width:1px;height:24px;background:var(--line)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.field select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;color:var(--ink)}
.sample{font-size:12px;font-weight:700;color:var(--brass);background:var(--brass-soft);padding:4px 10px;border-radius:99px}

.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:28px 72px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
.band h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,42px);line-height:1.1;margin:4px 0 6px}
.band .meta{color:var(--band-muted);font-size:14px}
.plan{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--band-2);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-width:140px}
.stat .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--band-muted)}
.stat .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:2px}
.stat .s{font-size:12px;color:var(--band-muted)}
.stat.hl{background:var(--band-brass);color:#2A1B04;border-color:transparent}
.stat.hl .k,.stat.hl .s,.stat.hl .statlink .s{color:#4A3307}

main.wrap{margin-top:-48px;padding-block:0 48px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px}
.panel-head .note{font-size:13px;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.col-main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.col-side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:12px;padding:14px}
.kpi .k{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}

.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr)) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px}
.rung.head{background:transparent;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-block:2px}
.rung.on{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
.rung.earned{outline:2px dashed var(--warn);outline-offset:-2px}
.rung .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface);color:var(--ink);white-space:nowrap}
.rung.on .tag{background:var(--accent);color:var(--accent-ink)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px}
.ok{background:var(--good-bg);color:var(--good)}
.no{background:var(--bad-bg);color:var(--bad)}
.wa{background:var(--warn-bg);color:var(--warn)}
.hint{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--brass-soft);color:var(--ink);font-size:14px}
.hint strong{color:var(--brass)}

dl.bd{display:grid;grid-template-columns:1fr auto;gap:10px 14px;margin:0;font-size:14px}
dl.bd dt{color:var(--muted)} dl.bd dd{margin:0;font-weight:600;text-align:right}
dl.bd .total{border-top:1px solid var(--line);padding-top:10px;font-size:16px;color:var(--ink);font-weight:700}

ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.tasks li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--surface-2)}
ul.tasks .t{flex:1 1 240px;min-width:0}
ul.tasks .t b{display:block}
ul.tasks .t span{font-size:13px;color:var(--muted)}
.src{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:99px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.btn.small{min-height:34px;padding:5px 10px;font-size:13px}
.btn:hover{border-color:var(--accent)}

ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.rev{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rev:first-child{border-top:0}
.rev .where{color:var(--muted);font-size:13px}
.stars{letter-spacing:2px;color:var(--brass)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tile .k{font-size:13px;color:var(--muted);font-weight:600}
.tile .v{font-size:28px;font-weight:700}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
tr.sum td{font-weight:700;border-top:2px solid var(--line);background:var(--surface-2)}
.flag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin:0 4px 4px 0}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.new{background:var(--accent-soft);color:var(--accent)}
.set{display:flex;flex-direction:column;gap:12px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.set input,.set select,.rulef input,.rulef select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;background:var(--surface);color:var(--ink)}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);color:var(--ink);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.small{font-size:12px;color:var(--muted)}

.rules{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.rule{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.rule .r-main{flex:1 1 200px;min-width:0}
.rule .r-main b{display:block;font-size:14px}
.rule .r-main span{font-size:12px;color:var(--muted)}
.rule .r-rate{font-weight:700;font-size:16px}
.rulef{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.rulef label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}

.chart{display:flex;align-items:flex-end;gap:12px;height:220px;padding:0 4px;border-bottom:1px solid var(--line);overflow-x:auto}
.chart .col{flex:1 0 56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.chart .stack{width:100%;max-width:64px;display:flex;flex-direction:column-reverse;border-radius:8px 8px 0 0;overflow:hidden}
.chart .stack div{width:100%}
.chart .amt{font-size:12px;font-weight:700}
.chart .lbl{font-size:12px;color:var(--muted);padding-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.actions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.actions li{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.actions li.hi{background:var(--warn-bg)}
.actions .t{flex:1 1 240px;min-width:0}
.actions .t b{display:block}
.actions .t span{font-size:13px;color:var(--muted)}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.stepper li{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:99px;background:var(--surface-2);font-size:14px;font-weight:600;color:var(--muted)}
.stepper .dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);font-size:12px}
.stepper li.done{color:var(--good);background:var(--good-bg)} .stepper li.done .dot{background:var(--good);color:#fff;border-color:var(--good)}
.stepper li.now{color:var(--ink);background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)} .stepper li.now .dot{background:var(--accent);color:#fff;border-color:var(--accent)}
table.slip{font-size:14px} table.slip td{padding:9px 8px}
table.slip tr.sec td{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface-2)}
table.slip tr.sub td{font-weight:700} table.slip tr.ded td.n{color:var(--bad)}
table.slip tr.net td{font-size:18px;font-weight:700;background:var(--band-brass);border-bottom:0}
.slip-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.slip-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.payouts{display:flex;flex-direction:column;gap:10px}
.payout{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.po-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-start}
.po-head b{display:block;font-size:14px}
.po-bar{display:flex;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.po-paid{background:var(--c-com)} .po-this{background:var(--c-bonus)}
.po-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.po-nums div{display:flex;flex-direction:column}
.po-nums b{font-size:15px}
.past{display:flex;flex-direction:column;gap:6px}
.past-btn{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-align:left;min-height:44px}
.past-btn[aria-expanded="true"]{background:var(--surface-2)}
.statbtn{padding:0;overflow:hidden}
.statbtn .k{padding:12px 16px 0}
.statlink{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:transparent;padding:2px 16px 12px;cursor:pointer;text-align:left;color:inherit;min-height:44px}
.statlink .v{font-size:26px;font-weight:700;line-height:1.2}
.statlink .s{font-size:12px;color:var(--band-muted)}
.statlink:hover u,.statlink:focus-visible u{color:var(--accent)}
.statbtn:hover{border-color:var(--accent)}
.sumrow{display:flex;flex-wrap:wrap;gap:8px}
.sumrow span{background:var(--surface-2);border-radius:99px;padding:6px 12px;font-size:13px}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.formula span{background:var(--surface-2);border-radius:10px;padding:8px 12px}
.formula span:nth-child(even){background:transparent;padding:0 2px;font-weight:700;color:var(--muted)}
.formula .res{background:var(--band-brass)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
.dialog.wide{max-width:860px;max-height:calc(100vh - 32px);overflow-y:auto}
.helpbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 17px/1 var(--display);font-style:italic;cursor:pointer;flex:none}
.helpbtn:hover,.helpbtn:focus-visible{background:var(--accent-soft);border-color:var(--accent)}
.helpbody{display:flex;flex-direction:column;gap:14px}
.helpsec h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 4px}
.helpsec p{margin:0;font-size:14px;line-height:1.6;max-width:68ch}
.faq{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
.faq summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;min-height:44px;display:flex;align-items:center}
.faq[open] summary{color:var(--accent)}
.faq p{margin:0 0 14px;font-size:14px;line-height:1.6;max-width:68ch}
.mc-acts{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.linkbtn.small{font-size:13px;font-weight:600}
.cleared{border-top:1px solid var(--line);padding-top:10px}
.cleared summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-height:32px;display:flex;align-items:center}
.mc-num{display:flex;flex-direction:column;gap:2px;min-width:0}
.mc-num .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:14px;user-select:all;white-space:nowrap}
.lockcard{display:flex;flex-direction:column;gap:12px;align-items:flex-start;background:var(--brass-soft);border:1px solid var(--line)}
.lockcard svg{color:var(--brass)}
.gate{display:flex;flex-direction:column;gap:6px}
.gate .track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.gate .fill{height:100%;background:var(--c-com);border-right:2px solid var(--accent)}
.rung.two{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto}
.tierbig{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:12px;background:var(--accent-soft)}
.tierbig .tb-name{font-family:var(--display);font-size:30px;line-height:1.1;color:var(--ink)}
.pending{color:var(--muted);font-weight:500;font-style:italic}
.earn-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.earn-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.earn-stats .es{border-radius:12px;padding:14px;background:var(--surface-2)}
.earn-stats .es.hl{background:var(--band-brass)}
.earn-stats .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.earn-stats .v{font-size:26px;font-weight:700}
.earn-stats .s{font-size:12px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(31,42,58,.35);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:18px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(31,42,58,.25);display:flex;flex-direction:column;gap:14px}
.dialog h2{font-size:26px}
.warnbox{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.warnbox b{color:var(--warn)}
.dialog label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.dialog label.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.dialog label.pw{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.dialog input[type=password]{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;background:var(--surface);color:var(--ink)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px}
.chkrow{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);font-weight:500}
.chkrow input{width:20px;height:20px;accent-color:var(--accent);margin-top:2px}
.info{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;padding:0;margin-left:6px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);font:700 11px/1 var(--body);font-style:italic;cursor:help;vertical-align:1px;text-transform:none;letter-spacing:0}
.info::after{content:"";position:absolute;inset:-12px}
.info:hover,.info:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
#tip{position:fixed;z-index:30;max-width:290px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;box-shadow:0 10px 28px rgba(31,42,58,.16);pointer-events:none}
@media (prefers-reduced-motion:no-preference){.panel,.tile{transition:border-color .2s}}
</style>

<div class="bar">

/* ---------- review pricing: highest matching rule wins, base rate always applies ---------- */
function reviewRate(platform, day){
  let rate = S.baseReview, rule = null;
  for(const r of S.reviewRules){
    if(r.platform!=='all' && r.platform!==platform) continue;
    if(day<1) continue;                      /* windows cover this month only */
    if(r.from!=null && day<r.from) continue;
    if(r.to!=null && day>r.to) continue;
    if(r.rate>rate){ rate=r.rate; rule=r; }
  }
  return {rate, rule};
}

/* ---------- CURRENT PLAN: pax tiers x performance multiplier + EGP bonuses ---------- */
function oldRate(pax){ let r=0; for(const [min,rate] of S.old.tiers){ if(pax>=min) r=rate; } return r; }
function oldLevel(conv, csat, nps, effInb){
  for(const L of S.old.levels){
    const okConv = conv >= L.conv;
    const okCsat = L.csat==null || (csat>0 && csat>=L.csat);
    const okNps = L.nps==null || (nps>0 && nps>=L.nps);
    const okInb = L.inb==null || effInb>=L.inb;
    if(okConv && okCsat && okNps && okInb) return L;
  }
  return S.old.levels[S.old.levels.length-1];
}
function calcOld(a, projected){
  const f = projected ? S.workDays/S.dayNo : 1;
  const inEx=Math.round(a.inEx*f), inAll=Math.round((a.inAll - acceptedMissed(a.id))*f), out=Math.round(a.out*f), deals=Math.round(a.deals*f), pax=Math.round(a.pax*f), cancels=Math.round(a.cancels*f);
  const effInb = inEx + Math.floor(out/10);
  const conv = inAll ? deals/inAll : 0;
  const finalPax = Math.max(0, pax - cancels);
  const rate = oldRate(finalPax);
  const L = oldLevel(conv, a.csat, a.nps, effInb);
  const baseUsd = finalPax * rate * L.mult;
  const ins = Math.round(a.ins*f);
  const priced = a.reviews.map(r => ({platform:r[0], day:r[1], ...reviewRate(r[0], r[1])}));
  const reviewEst = priced.reduce((s,r)=>s+r.rate,0) * f;
  const reviewEgp = S.reviewsCounted ? reviewEst : 0;
  const insEst = ins*S.old.insurance;
  const insEgp = S.insReceived ? insEst : 0;
  const bonusEgp = insEgp + a.stipend + a.incentive + reviewEgp;
  const bonusEst = insEst + a.stipend + a.incentive + reviewEst;
  const totalEgp = baseUsd*S.fx + bonusEgp;
  const flags = [];
  if(rate===0) flags.push(['no','Under 50 pax: no pax commission']);
  if(effInb < 65 && conv >= .6) flags.push(['wa', (65-effInb)+' short of 65 inbound gate']);
  if(conv < .5) flags.push(['wa','Conversion under 50%']);
  const nextTier = S.old.tiers.find(t => t[0] > finalPax);
  if(!S.insReceived && ins) flags.push(['wa','Insurance waiting for vendor file']);
  return { plan:'old', inEx, inAll, out, deals, pax, cancels, effInb, conv, finalPax, rate, level:L, baseUsd, ins, insEgp, insEst, priced, reviewEgp, reviewEst, bonusEgp, bonusEst, totalEgp, flags, nextTier,
    comUsd: baseUsd, units: finalPax, unitName:'pax',
    volume: finalPax+' pax', tierLabel: rate ? ('$'+rate+'/pax') : '$0/pax', quality: L.name+' ('+L.mult+'x)' };
}

function newTierIndex(count){ return S.nw.tiers.findIndex(t => count>=t.min && count<=t.max); }
function newPay(i, b, met){
  const count = i + b;

  const T = paidIdx >= 0 ? S.nw.tiers[paidIdx] : null;

function seed(id, m){ let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))%997; return 0.78 + ((h + m*53) % 37)/100; }
function history(a){

    if(m===5){ const c = calc(a,true); out.push({m, live:true, salary:a.salary, com:c.comUsd*S.fx, bonus:c.bonusEst, units:c.units}); continue; }
    if(a.plan==='new'){
      const startIdx = 6 - a.monthNo;
      if(m < startIdx){ out.push(null); continue; }
      const ramp = Math.pow((m-startIdx+1)/a.monthNo, 1.3);
      const i = Math.round((a.fpI+a.scI)*ramp*seed(a.id,m)), b = Math.round((a.fpB+a.scB)*ramp*seed(a.id,m));
      const p = newPay(i, b, true);

      out.push({m, salary:a.salary, com:p.usd*FX_HIST[m], bonus:reviews, units:p.count});
    } else {
      const f = seed(a.id,m) * (S.workDays/S.dayNo);
      const finalPax = Math.max(0, Math.round((a.pax-a.cancels)*f));
      const conv = a.deals/a.inAll, effInb = Math.round(a.inEx*f) + Math.floor(a.out*f/10);

/* ---------- DEDUCTIONS AND PAYOUTS: basic salary paid ~31st, commission paid ~15th of next month ---------- */
const STAGES = [
  {k:'draft', label:'Preparing', next:'Send to agents for review'},
  {k:'preview', label:'Agents reviewing', next:'Mark basic salary as paid'},
  {k:'basicPaid', label:'Basic salary paid', next:'Mark commission as paid'},
  {k:'comPaid', label:'Commission paid', next:null}
];
const PAYRUN = { month:'October 2026', reviewEnds:'Thu 29 Oct, 17:00', basicDate:'31 Oct', basicWindow:'29 Oct to 2 Nov', comDate:'15 Nov', comWindow:'13 to 17 Nov' };
const SRC = { basic:'Basic salary', commission:'Commission' };
const DED_TYPES = ['Unpaid absence','Late arrivals','Equipment','Other'];
let nextDedId = 10, nextPayoutId = 10;
const DEDUCTIONS = [
  {id:2, agent:'karim', type:'Late arrivals', amount:300, from:'basic', note:'2 late days in October, per attendance policy'},
  {id:3, agent:'tarek', type:'Equipment', amount:450, from:'basic', note:'Replacement headset'}
];
AGENTS.forEach(a => { if(a.att[2] > 0) DEDUCTIONS.push({id:nextDedId++, agent:a.id, type:'Unpaid absence', amount:Math.round(a.salary/S.workDays*a.att[2]), from:'basic', note:`${a.att[2]} absent day${a.att[2]>1?'s':''} × basic salary ÷ ${S.workDays} working days`}); });
/* payout agreements: money the company paid because of an agent's mistake, repaid in agreed monthly amounts from basic salary, commission, or both */
const PAYOUTS = [
  {id:1, agent:'youssef', reason:'Booking error: wrong cabin category booked, the price difference was refunded to the customer', agreed:'12 Sep 2026', total:6000, fromBasic:500, fromCom:500, paidBefore:1000},
  {id:2, agent:'tarek', reason:'Missed final payment reminder, the booking cancelled and the company paid the cancellation fee', agreed:'8 Oct 2026', total:3600, fromBasic:1200, fromCom:0, paidBefore:0},
  {id:3, agent:'nour', reason:'Wrong advice: customer was told no visa was needed for a port stop, was refused boarding, and the company paid his rebooking', agreed:'3 Aug 2026', total:10000, fromBasic:0, fromCom:2500, paidBefore:5000}
];
const ACK = { dina:'ok', laila:'ok', salma:'ok', rana:'ok', karim:'query' };
const QUERIES = [ {id:1, agent:'karim', line:'Late arrivals', msg:'I was on approved leave on 12 Oct, so that day should not count as late.', open:true} ];
let nextQueryId = 2;

function instalment(p){
  const left = Math.max(0, p.total - p.paidBefore);
  const b = Math.min(p.fromBasic, left), c = Math.min(p.fromCom, left - b);
  return { b, c, t: b + c };
}
const stageIdx = () => STAGES.findIndex(s => s.k===S.payStage);
function monthDeductions(a){
  const lines = DEDUCTIONS.filter(d => d.agent===a.id).map(d => ({label:d.type, amount:d.amount, note:d.note, from:d.from, id:d.id}));
  PAYOUTS.filter(p => p.agent===a.id).forEach(p => { const i = instalment(p);
    if(i.b) lines.push({label:'Payout instalment', amount:i.b, note:p.reason, from:'basic', payout:p.id});
    if(i.c) lines.push({label:'Payout instalment', amount:i.c, note:p.reason, from:'commission', payout:p.id}); });
  const basic = lines.filter(l=>l.from==='basic'), com = lines.filter(l=>l.from==='commission');
  const sum = arr => arr.reduce((s,l)=>s+l.amount,0);
  return { lines, basic, com, basicTotal:sum(basic), comTotal:sum(com), total:sum(lines), salaryAfter: a.salary - sum(basic) };
}

function payoutCard(p, showAgent){
  const i = instalment(p), si = stageIdx();
  const paidNow = (si>=2 ? i.b : 0) + (si>=3 ? i.c : 0);
  const remainingAfter = Math.max(0, p.total - p.paidBefore - i.t);
  const per = p.fromBasic + p.fromCom;
  const monthsLeft = Math.ceil(Math.max(0, p.total - p.paidBefore) / per);
  const pctPaid = Math.round(p.paidBefore / p.total * 100), pctThis = Math.round(i.t / p.total * 100);
  const ag = AGENTS.find(x=>x.id===p.agent);
  const split = [p.fromBasic ? `LE ${p.fromBasic.toLocaleString('en-US')} from basic salary` : '', p.fromCom ? `LE ${p.fromCom.toLocaleString('en-US')} from commission` : ''].filter(Boolean).join(' + ');
  return `<div class="payout">
    <div class="po-head"><div><b>${showAgent ? esc(ag.name)+' · ' : ''}${esc(p.reason)}</b><span class="small">Agreed ${esc(p.agreed)} · ${split} each month</span></div>
      ${remainingAfter<=0 ? '<span class="pill ok">Fully repaid after this month</span>' : `<span class="pill wa">${monthsLeft} month${monthsLeft===1?'':'s'} left</span>`}</div>
    <div class="po-bar" role="img" aria-label="${pctPaid}% repaid before this month, ${pctThis}% this month"><div class="po-paid" style="width:${pctPaid}%"></div><div class="po-this" style="width:${pctThis}%"></div></div>
    <div class="po-nums">
      <div><span class="small">Total agreed</span><b>${egp(p.total)}</b></div>
      <div><span class="small">Paid so far</span><b>${egp(p.paidBefore + paidNow)}</b></div>
      <div><span class="small">This month</span><b>${egp(i.t)}</b><span class="small">${[i.b?egp(i.b)+' basic':'', i.c?egp(i.c)+' commission':''].filter(Boolean).join(' · ')}</span></div>
      <div><span class="small">Remaining after</span><b>${egp(remainingAfter)}</b></div>
    </div></div>`;
}

function dedTable(lines, title, when, done){
  if(!lines.length) return '';
  let h = `<div class="ded-group"><div class="slip-head"><h3>${title}</h3><span class="small">${done ? 'Paid' : 'Paid around'} ${when}</span></div><div class="tscroll"><table class="slip" style="min-width:0"><tbody>`;
  lines.forEach(l => h += `<tr class="ded"><td>${esc(l.label)}<div class="small">${esc(l.note)}</div></td><td class="n">− ${egp(l.amount)}</td></tr>`);
  return h + `<tr class="net"><td>Total</td><td class="n">− ${egp(lines.reduce((s,l)=>s+l.amount,0))}</td></tr></tbody></table></div></div>`;
}

/* ---------- RAW DATA behind each top-strip number (sample; live tool reads Aircall and HubSpot) ---------- */
const ITINS = ['Western Caribbean 7N','Greek Isles 10N','Alaska Inside Passage 7N','Bahamas 4N','Mediterranean 7N','Norwegian Fjords 12N','Eastern Caribbean 5N','Bermuda 5N'];
const tstr = (hh,mm) => String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
const sortDesc = (x,y) => (y.day-x.day) || (y.time<x.time?-1:y.time>x.time?1:0);
function inboundCalls(a){
  const ix = AGENTS.indexOf(a), rows = [];
  for(let k=0; k<a.inEx; k++){ const day = 1 + Math.floor(k*16/Math.max(a.inEx,1));
    rows.push({day, time:tstr(9 + (k*7+ix)%9, (k*23+ix*5)%60), name:CALLERS[(k*7+ix)%CALLERS.length], num:'+1 (' + [954,305,407,212,813,786][(k+ix+2)%6] + ') 555-01' + String((k*11+ix)%90+10), line: k%4 ? 'Sales line' : 'Bonus queue', dur: (2 + (k*5)%17)+' min', result:'Answered'}); }
  monthMissed(a).forEach(m => { const d = disputeFor(m.id); if(d && d.status==='accepted') return; rows.push({day:m.day, time:m.time, name:m.name, num:m.num, line:m.line, dur:'Rang '+m.ring, result:'Missed'}); });
  return rows.sort(sortDesc);
}
function outboundCalls(a){
  const ix = AGENTS.indexOf(a), rows = [], outcomes = ['Connected','No answer','Connected','Voicemail','Connected','No answer'];
  for(let k=0; k<a.out; k++){ const day = 1 + Math.floor(k*16/Math.max(a.out,1)), oc = outcomes[(k+ix)%outcomes.length];
    rows.push({day, time:tstr(9 + (k*3+ix)%9, (k*19+ix)%60), name:CALLERS[(k*3+ix+1)%CALLERS.length], num:'+1 (' + [305,954,212,407,786,813][(k+ix)%6] + ') 555-01' + String((k*13+ix*7)%90+10), dur: oc==='Connected' ? (1 + (k*3)%12)+' min' : '0 min', result:oc}); }
  return rows.sort(sortDesc);
}
function dealsList(a){
  const ix = AGENTS.indexOf(a), rows = [];
  for(let k=0; k<a.deals; k++){ const day = 1 + Math.floor(k*16/Math.max(a.deals,1));
    rows.push({day, time:tstr(10 + (k*5+ix)%8, (k*29+ix)%60), name:CALLERS.filter(Boolean)[(k+ix)%7], deal:'Deal '+(48000 + ix*400 + k*7), cruise:ITINS[(k+ix)%ITINS.length], pax: 1 + (k+ix)%4}); }
  return rows.sort(sortDesc);
}
function dataModal(a, kind){
  const now = calc(a,false);
  const head = {inbound:'Your inbound calls', outbound:'Your outbound calls', effective:'How your effective inbound adds up', conversion:'How your conversion is calculated'}[kind];
  let h = `<div class="modal" id="dataModal"><div class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="earn-head"><h2 id="dTitle">${head}</h2><button type="button" class="btn" id="dataClose">Close</button></div>`;
  const tableWrap = inner => `<div class="tscroll" style="max-height:min(56vh,500px);overflow-y:auto">${inner}</div>`;
  const nm = r => `<b>${r.name ? esc(r.name) : 'Unknown caller'}</b><div class="small" style="font-family:ui-monospace,Menlo,monospace">${esc(r.num)}</div>`;
  if(kind==='inbound'){
    const rows = inboundCalls(a), miss = rows.filter(r=>r.result==='Missed').length;
    h += `<div class="sumrow"><span><b>${rows.length}</b> inbound</span><span><b>${rows.length-miss}</b> answered</span><span><b>${miss}</b> missed</span></div>`;
    h += tableWrap(`<table style="min-width:620px"><thead><tr><th>When</th><th>Caller</th><th>Line</th><th>Length</th><th>Result</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.day} Oct, ${r.time}</td><td>${nm(r)}</td><td>${r.line}</td><td>${r.dur}</td><td>${r.result==='Missed'?'<span class="flag wa">Missed</span>':'Answered'}</td></tr>`).join('')}</tbody></table>`);
  } else if(kind==='outbound'){
    const rows = outboundCalls(a), con = rows.filter(r=>r.result==='Connected').length;
    h += `<div class="sumrow"><span><b>${rows.length}</b> outbound</span><span><b>${con}</b> connected</span><span><b>${Math.floor(rows.length/10)}</b> inbound credits</span></div>`;
    h += tableWrap(`<table style="min-width:620px"><thead><tr><th>When</th><th>Called</th><th>Length</th><th>Result</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.day} Oct, ${r.time}</td><td>${nm(r)}</td><td>${r.dur}</td><td>${r.result}</td></tr>`).join('')}</tbody></table>`);
  } else if(kind==='effective'){
    const inb = inboundCalls(a).filter(r=>r.result==='Answered'), out = outboundCalls(a), days = {};
    inb.forEach(r => (days[r.day] ||= {a:0,o:0}).a++); out.forEach(r => (days[r.day] ||= {a:0,o:0}).o++);
    let cumO = 0;
    const list = Object.keys(days).map(Number).sort((x,y)=>x-y).map(d => { cumO += days[d].o; return {d, a:days[d].a, o:days[d].o, credits:Math.floor(cumO/10)}; });
    h += `<div class="formula"><span><b>${inb.length}</b> answered inbound</span><span>+</span><span><b>${Math.floor(out.length/10)}</b> credits from ${out.length} outbound</span><span>=</span><span class="res"><b>${inb.length + Math.floor(out.length/10)}</b> effective inbound</span></div>
      <p class="small" style="margin:0">Every 10 outbound calls give 1 credit. Missed calls don't count here.</p>`;
    h += tableWrap(`<table style="min-width:520px"><thead><tr><th>Day</th><th class="n">Answered inbound</th><th class="n">Outbound</th><th class="n">Credits so far</th></tr></thead><tbody>${list.map(r=>`<tr><td>${r.d} Oct</td><td class="n">${r.a}</td><td class="n">${r.o}</td><td class="n">${r.credits}</td></tr>`).join('')}</tbody></table>`);
  } else {
    const rows = dealsList(a), inAll = now.inAll;
    h += `<div class="formula"><span><b>${rows.length}</b> deals</span><span>÷</span><span><b>${inAll}</b> inbound calls, including missed</span><span>=</span><span class="res"><b>${pct(inAll ? rows.length/inAll : 0)}</b> conversion</span></div>
      <p class="small" style="margin:0">Missed calls stay in the total because each one was a chance to book.</p>`;
    h += tableWrap(`<table style="min-width:620px"><thead><tr><th>Closed</th><th>Customer</th><th>Deal</th><th>Cruise</th><th class="n">Pax</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.day} Oct, ${r.time}</td><td><b>${esc(r.name)}</b></td><td>${r.deal}</td><td>${r.cruise}</td><td class="n">${r.pax}</td></tr>`).join('')}</tbody></table>`);
  }
  h += `<p class="small" style="margin:0">Something here looks wrong? <button type="button" class="linkbtn" data-ticket-topic="${kind==='conversion'?'Deals or conversion':'Calls'}">Raise a ticket</button></p>`;
  return h + `</div></div>`;
}

  mine.slice().reverse().forEach(t => h += `<div class="rule"><div class="r-main"><b>${esc(t.topic)}${t.ref?' · '+esc(t.ref):''}</b><span>${esc(t.msg)}</span>${t.reply?`<span style="color:var(--ink)"><b>Reply:</b> ${esc(t.reply)}</span>`:''}</div>${t.status==='open'?'<span class="flag wa">Open</span>':'<span class="flag ok">Answered</span>'}</div>`);

}

      <button type="button" data-tab="payroll" aria-pressed="${tab==='payroll'}">This month</button>
      <button type="button" data-tab="rules" aria-pressed="${tab==='rules'}">Review rules</button>
      <button type="button" data-tab="payslips" aria-pressed="${tab==='payslips'}">Deductions and payouts</button>
      <button type="button" data-tab="history" aria-pressed="${tab==='history'}">Cost history</button>
    </div>`;
  h += tab==='rules' ? rulesTab() : tab==='history' ? historyTab() : tab==='payslips' ? deductionsTab() : payrollTab();
  return h + `</main>`;
}

/* ---------- render + events ---------- */
const app = document.getElementById('app');
const sel = document.getElementById('agentSel');
sel.innerHTML = '<optgroup label="Legacy commission plan">' + AGENTS.filter(a=>a.plan==='old').map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('') + '</optgroup>'
  + '<optgroup label="Q3 2026 plan">' + AGENTS.filter(a=>a.plan==='new').map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('') + '</optgroup>';
function render(){
  if(typeof hideTip==='function') hideTip();
  document.getElementById('v-agent').setAttribute('aria-pressed', state.view==='agent');
  document.getElementById('v-admin').setAttribute('aria-pressed', state.view==='admin');
  document.getElementById('agentPick').hidden = state.view!=='agent';
  document.getElementById('ticketBtn').hidden = state.view!=='agent';
  sel.value = state.agentId;
  app.innerHTML = (state.view==='agent' ? agentView(AGENTS.find(a=>a.id===state.agentId)) : adminView()) + (state.helpOpen ? helpModal() : '') + (state.view==='agent' && state.dataOpen ? dataModal(AGENTS.find(a=>a.id===state.agentId), state.dataOpen) : '') + (state.view==='agent' && state.ticketOpen ? ticketModal(AGENTS.find(a=>a.id===state.agentId)) : '');
}
document.getElementById('v-agent').addEventListener('click', ()=>{ state.view='agent'; try{localStorage.setItem('chview','agent')}catch(e){} render(); });
document.getElementById('v-admin').addEventListener('click', ()=>{ state.view='admin'; try{localStorage.setItem('chview','admin')}catch(e){} render(); });
sel.addEventListener('change', ()=>{ state.agentId = sel.value; state.unlocked=false; state.modal=false; state.queryOpen=false; state.missedOpen=false; render(); });
const tip = document.createElement('div'); tip.id='tip'; tip.setAttribute('role','tooltip'); tip.hidden=true; document.body.appendChild(tip);
let tipFor = null;
function showTip(b){
  tip.textContent = TIPS[b.dataset.tip] || ''; tip.hidden = false; tipFor = b; b.setAttribute('aria-describedby','tip');
  const r = b.getBoundingClientRect(), w = tip.offsetWidth, ht = tip.offsetHeight;
  let left = Math.max(12, Math.min(r.left + r.width/2 - w/2, innerWidth - w - 12));
  let top = r.bottom + 8; if(top + ht > innerHeight - 12) top = r.top - ht - 8;
  tip.style.left = left + 'px'; tip.style.top = Math.max(12, top) + 'px';
}
function hideTip(){ tip.hidden = true; if(tipFor) tipFor.removeAttribute('aria-describedby'); tipFor = null; }
document.addEventListener('mouseover', e=>{ const b = e.target.closest && e.target.closest('.info'); if(b) showTip(b); });
document.addEventListener('mouseout', e=>{ if(e.target.closest && e.target.closest('.info')) hideTip(); });
document.addEventListener('focusin', e=>{ const b = e.target.closest && e.target.closest('.info'); b ? showTip(b) : hideTip(); });
window.addEventListener('scroll', hideTip, {passive:true});
function closeModal(){ state.modal=false; state.modalErr=''; render(); document.getElementById('unlockBtn')?.focus(); }
document.getElementById('ticketBtn').addEventListener('click', ()=>{ state.ticketOpen=true; state.ticketSent=false; state.ticketErr=''; state.ticketTopic='Calls'; render(); document.getElementById('tk-topic')?.focus(); });
function closeData(){ state.dataOpen=null; render(); }
function closeTicket(){ state.ticketOpen=false; state.ticketSent=false; render(); document.getElementById('ticketBtn').focus(); }
document.getElementById('helpBtn').addEventListener('click', ()=>{ state.helpOpen=true; render(); document.getElementById('helpClose')?.focus(); });
function closeHelp(){ state.helpOpen=false; render(); document.getElementById('helpBtn').focus(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && state.ticketOpen){ closeTicket(); return; } if(e.key==='Escape' && state.dataOpen){ closeData(); return; } if(e.key==='Escape' && state.helpOpen){ closeHelp(); return; } if(e.key==='Escape'){ hideTip(); if(state.modal) closeModal(); if(state.missedOpen){ state.missedOpen=false; state.disputeFor=null; render(); document.getElementById('missedBtn')?.focus(); } } });
app.addEventListener('click', e=>{
  const t = e.target;
  const sb = t.closest('button[type="submit"]'); if(sb && sb.form){ e.preventDefault(); onSubmit({target: sb.form, preventDefault(){}}); return; }
  const ib = t.closest('.info'); if(ib){ e.stopPropagation(); (tipFor===ib && !tip.hidden) ? hideTip() : showTip(ib); return; }
  hideTip();
  if(t.id==='ackOk'){ ACK[state.agentId]='ok'; render(); return; }
  if(t.id==='ackQ'){ state.queryOpen=true; state.queryErr=''; render(); document.getElementById('q-line')?.focus(); return; }
  if(t.id==='qCancel'){ state.queryOpen=false; render(); return; }
  const pb = t.closest('[data-past]'); if(pb){ const k = state.agentId+pb.dataset.past; state.pastOpen = state.pastOpen===k ? null : k; render(); return; }
  if(t.id==='stageNext'){ S.payStage = STAGES[Math.min(stageIdx()+1, STAGES.length-1)].k; render(); return; }
  if(t.id==='stageReset'){ S.payStage='draft'; render(); return; }
  const rs = t.closest('[data-resolve]'); if(rs){ const q = QUERIES.find(x=>x.id===+rs.dataset.resolve); if(q) q.open=false; render(); return; }
  const dd = t.closest('[data-delded]'); if(dd){ const ix = DEDUCTIONS.findIndex(x=>x.id===+dd.dataset.delded); if(ix>=0) DEDUCTIONS.splice(ix,1); render(); return; }
  const sl = t.closest('[data-slip]'); if(sl){ state.slipAgent = sl.dataset.slip; render(); document.getElementById('pr3')?.scrollIntoView({block:'start'}); return; }
  const cn = t.closest('[data-callnow]'); if(cn){ const key = cn.dataset.callnow, ag = state.agentId; state.calling = key; state.otherFor = null; render();
    setTimeout(()=>{ const d = new Date(); (state.calledBack[ag] ||= {})[key] = {how:'callback', time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'), dur:(2+Math.floor(Math.random()*6))+' min'}; if(state.calling===key) state.calling=null; render(); }, 1800); return; }
  const oth = t.closest('[data-other]'); if(oth){ state.otherFor = oth.dataset.other; render(); document.getElementById('ot-reason')?.focus(); return; }
  if(t.id==='otCancel'){ state.otherFor=null; render(); return; }
  const d = t.closest('[data-dismiss]'); if(d){ (state.dismissed[state.agentId] ||= {})[d.dataset.dismiss] = true; render(); return; }
  const m = t.closest('[data-mode]'); if(m){ state.adminMode = m.dataset.mode; render(); return; }
  const tb = t.closest('[data-tab]'); if(tb){ state.adminTab = tb.dataset.tab; state.ruleMsg=''; render(); return; }
  const mt = t.closest('[data-metric]'); if(mt){ state.histMetric = mt.dataset.metric; render(); return; }
  const hr = t.closest('[data-hist]'); if(hr){ state.histAgent = hr.dataset.hist; render(); document.getElementById('h2')?.scrollIntoView({block:'start'}); return; }
  const dr = t.closest('[data-delrule]'); if(dr){ S.reviewRules = S.reviewRules.filter(r=>r.id!==+dr.dataset.delrule); state.ruleMsg='Rule removed. All agents recalculated.'; render(); return; }
  const o = t.closest('[data-open]'); if(o){ state.agentId = o.dataset.open; state.view='agent'; state.unlocked=false; render(); window.scrollTo(0,0); return; }
  const tt = t.closest('[data-ticket-topic]'); if(tt){ state.ticketTopic = tt.dataset.ticketTopic; state.dataOpen=null; state.helpOpen=false; state.ticketOpen=true; state.ticketSent=false; state.ticketErr=''; render(); document.getElementById('tk-msg')?.focus(); return; }
  if(t.id==='ticketClose' || t.id==='ticketModal'){ closeTicket(); return; }
  const dd2 = t.closest('[data-data]'); if(dd2){ state.dataOpen = dd2.dataset.data; render(); document.getElementById('dataClose')?.focus(); return; }
  if(t.id==='dataClose' || t.id==='dataModal'){ closeData(); return; }
  const ans = t.closest('[data-answer]'); if(ans){ const tk = TICKETS.find(x=>x.id===+ans.dataset.answer); const v = document.getElementById('tr-'+ans.dataset.answer).value.trim(); if(tk){ tk.reply = v || 'Looked into this, see your team lead for details.'; tk.status='answered'; } render(); return; }
  if(t.id==='helpClose' || t.id==='helpModal'){ closeHelp(); return; }
  const ht = t.closest('[data-helptab]'); if(ht){ state.helpTab = ht.dataset.helptab; render(); return; }
  if(t.closest('#missedBtn')){ state.missedOpen=true; state.disputeFor=null; render(); document.getElementById('mmClose')?.focus(); return; }
  if(t.id==='mmClose' || t.id==='missedModal'){ state.missedOpen=false; state.disputeFor=null; render(); document.getElementById('missedBtn')?.focus(); return; }
  const dsb = t.closest('[data-dispute]'); if(dsb){ state.disputeFor = dsb.dataset.dispute; state.disputeErr=''; render(); document.getElementById('dp-reason')?.focus(); return; }
  if(t.id==='dpCancel'){ state.disputeFor=null; render(); return; }
  const dsp = t.closest('[data-dsp]'); if(dsp){ const d = DISPUTES.find(x=>x.id===+dsp.dataset.did); if(d) d.status = dsp.dataset.dsp; render(); return; }
  if(t.closest('#unlockBtn')){ state.modal=true; state.modalErr=''; render(); document.getElementById('m-ack')?.focus(); return; }
  if(t.id==='m-cancel' || t.id==='unlockModal'){ closeModal(); return; }
  if(t.id==='lockBtn'){ state.unlocked=false; render(); window.scrollTo(0,0); return; }
  if(t.id==='copyCsv'){
    const box = document.getElementById('csvBox'), msg = document.getElementById('copyMsg');
    const done = ok => { msg.textContent = ok ? 'Copied' : 'Select the text below and copy it'; if(!ok){ box.focus(); box.select(); } };
    try{ navigator.clipboard.writeText(box.value).then(()=>done(true), ()=>done(false)); }catch(err){ done(false); }
  }
});
function onSubmit(e){
  if(e.target.id==='otherForm'){
    e.preventDefault(); const d = new Date();
    (state.calledBack[state.agentId] ||= {})[state.otherFor] = {how:'other', reason:document.getElementById('ot-reason').value, time:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
    state.otherFor=null; render(); return;
  }
  if(e.target.id==='ticketForm'){
    e.preventDefault();
    const msg = document.getElementById('tk-msg').value.trim();
    if(!msg){ state.ticketErr='Tell us what looks wrong so we can look into it.'; state.ticketTopic=document.getElementById('tk-topic').value; render(); return; }
    TICKETS.push({id:nextTicketId++, agent:state.agentId, topic:document.getElementById('tk-topic').value, ref:document.getElementById('tk-ref').value.trim(), msg, status:'open', reply:''});
    state.ticketSent=true; state.ticketErr=''; render(); return;
  }
  if(e.target.id==='disputeForm'){
    e.preventDefault();
    const note = document.getElementById('dp-note').value.trim();
    if(!note){ state.disputeErr='Add a short explanation so your manager can check it.'; render(); return; }
    DISPUTES.push({id:nextDisputeId++, agent:state.agentId, call:state.disputeFor, reason:document.getElementById('dp-reason').value, note, status:'pending'});
    state.disputeFor=null; render(); return;
  }
  if(e.target.id==='queryForm'){
    e.preventDefault();
    const msg = document.getElementById('q-msg').value.trim(), line = document.getElementById('q-line').value;
    if(!msg){ state.queryErr='Tell us what looks wrong so we can check it.'; render(); return; }
    QUERIES.push({id:nextQueryId++, agent:state.agentId, line, msg, open:true}); ACK[state.agentId]='query'; state.queryOpen=false; render(); return;
  }
  if(e.target.id==='payForm'){
    e.preventDefault();
    const tot = parseFloat(document.getElementById('po-total').value), fb = parseFloat(document.getElementById('po-basic').value)||0, fc = parseFloat(document.getElementById('po-com').value)||0, why = document.getElementById('po-reason').value.trim();
    if(!(tot>0)){ state.payErr='Enter the total agreed in EGP.'; render(); return; }
    if(fb<0 || fc<0 || fb+fc<=0){ state.payErr='Enter a monthly amount from basic salary, commission, or both.'; render(); return; }
    if(fb+fc>tot){ state.payErr='The monthly amount cannot be more than the total.'; render(); return; }
    if(!why){ state.payErr='Add the reason from the signed agreement. The agent sees it.'; render(); return; }
    const ag = document.getElementById('po-agent').value;
    PAYOUTS.push({id:nextPayoutId++, agent:ag, reason:why, agreed:'17 Oct 2026', total:Math.round(tot), fromBasic:Math.round(fb), fromCom:Math.round(fc), paidBefore:0}); state.slipAgent=ag; state.payErr=''; render(); return;
  }
  if(e.target.id==='dedForm'){
    e.preventDefault();
    const amt = parseFloat(document.getElementById('d-amt').value), note = document.getElementById('d-note').value.trim();
    if(!(amt>0)){ state.dedErr='Enter an amount in EGP.'; render(); return; }
    if(!note){ state.dedErr='Add a reason. The agent sees it with their deductions.'; render(); return; }
    const ag = document.getElementById('d-agent').value;
    DEDUCTIONS.push({id:nextDedId++, agent:ag, type:document.getElementById('d-type').value, amount:Math.round(amt), from:document.getElementById('d-from').value, note}); state.slipAgent=ag; state.dedErr=''; render(); return;
  }
  if(e.target.id==='unlockForm'){
    e.preventDefault();
    const ack = document.getElementById('m-ack').checked, pw = document.getElementById('m-pw').value;
    if(!ack){ state.modalErr='Tick the box to confirm you will keep your figures private.'; render(); document.getElementById('m-ack')?.focus(); return; }
    if(!pw){ state.modalErr='Enter your password.'; render(); document.getElementById('m-ack').checked=true; document.getElementById('m-pw')?.focus(); return; }
    state.modal=false; state.modalErr=''; state.unlocked=true; render(); document.getElementById('e1')?.scrollIntoView({block:'start'}); return;
  }
  if(e.target.id!=='ruleForm') return;
  e.preventDefault();
  const v = id => document.getElementById(id).value.trim();
  const from = v('rf-from') ? parseInt(v('rf-from'),10) : null, to = v('rf-to') ? parseInt(v('rf-to'),10) : null, rate = parseFloat(v('rf-rate'));
  if(!(rate>=0)){ state.ruleMsg='Enter a rate in EGP, for example 500.'; render(); return; }
  if((from!=null && (from<1||from>31)) || (to!=null && (to<1||to>31)) || (from!=null && to!=null && from>to)){ state.ruleMsg='Check the dates: use days 1 to 31, with From before To.'; render(); return; }
  const plat = v('rf-plat');
  S.reviewRules.push({id:nextRuleId++, label: v('rf-label') || (PLATFORMS[plat]+' bonus'), platform:plat, from, to, rate});
  state.ruleMsg='Rule added. All agents recalculated.'; render();
}
app.addEventListener('submit', onSubmit);
app.addEventListener('keydown', e=>{ const o = e.target.closest('[data-open],[data-hist],[data-slip]'); if(o && (e.key==='Enter'||e.key===' ') && e.target===o){ e.preventDefault(); o.click(); } });
app.addEventListener('change', e=>{
  const t = e.target;
  if(t.id==='s-fx'){ const v=parseFloat(t.value); if(v>0) S.fx=v; }
  else if(t.id==='s-conv'){ const v=parseFloat(t.value); if(v>=0&&v<=100) S.nw.conv=v/100; }
  else if(t.id==='s-day'){ const v=parseInt(t.value,10); if(v>=1&&v<=S.workDays) S.dayNo=v; }
  else if(t.id==='s-ins'){ S.insReceived = t.checked; }
  else if(t.id==='s-revc'){ S.reviewsCounted = t.checked; }
  else if(t.id==='r-base'){ const v=parseFloat(t.value); if(v>=0){ S.baseReview=v; state.ruleMsg='Base rate updated. All agents recalculated.'; } }
  else return;
  render();
});
window.__calc = {calcNew, calcOld, newPay, reviewRate, history, S, AGENTS};
render();
})();
</script>
